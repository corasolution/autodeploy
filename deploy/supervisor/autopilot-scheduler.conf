; AutoPilot Deploy — Laravel scheduler
;
; Alternative to a crontab entry. Use ONE of the two, not both.
[program:autopilot-scheduler]
process_name=%(program_name)s
command=php /var/www/autopilot/artisan schedule:work
directory=/var/www/autopilot
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autopilot-scheduler.log
stdout_logfile_maxbytes=20MB
