; AutoPilot Deploy — Reverb websocket server (live deploy terminal)
[program:autopilot-reverb]
process_name=%(program_name)s
command=php /var/www/autopilot/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/autopilot
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autopilot-reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stopwaitsecs=10
