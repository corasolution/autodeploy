; AutoPilot Deploy — queue worker
;
; UPGRADE-v2 Phase 6. Copy to /etc/supervisor/conf.d/ then:
;   supervisorctl reread && supervisorctl update && supervisorctl status
;
; timeout=3600 matches RunDeploymentJob::$timeout — a worker killed mid-upload
; leaves a half-extracted release behind.
[program:autopilot-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/autopilot/artisan queue:work --queue=deployments,default --tries=1 --timeout=3600 --sleep=3 --max-jobs=50
directory=/var/www/autopilot
autostart=true
autorestart=true
; Deploys are sequential by design: two workers could deploy the same site at
; once and interleave their releases.
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autopilot-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
; Give an in-flight deploy time to finish before SIGKILL.
stopwaitsecs=3700
stopasgroup=true
killasgroup=true
